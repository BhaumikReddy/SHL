services:
  - type: web
    name: shl-recommender
    runtime: python
    buildCommand: "pip install -r requirements.txt && python scripts/build_index.py"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.10.0